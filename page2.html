document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n  <\u002Fheader>\n\n  <sc-if value=\"{{ showEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 32px 24px;\">\n      <div style=\"max-width: 960px; width: 100%;\">\n        <div sc-camel-on-click=\"{{ pickFile }}\" sc-camel-on-drag-over=\"{{ dragOver }}\" sc-camel-on-drag-leave=\"{{ dragLeave }}\" sc-camel-on-drop=\"{{ drop }}\" style=\"background: {{ dropBg }}; border: 1.5px dashed {{ dropBorder }}; border-radius: 18px; padding: 56px 24px; text-align: center; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;\">\n          <div style=\"width: 40px; height: 40px; border-radius: 100px; background: #F4F4F2; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #6B7076;\">⬆<\u002Fdiv>\n          <div style=\"font-size: 16px; font-weight: 650; letter-spacing: -0.01em;\">Drop your Main Image<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #9A9A94;\">or click to browse — multiple images allowed, JPEG/PNG, ideally ≥1600 px<\u002Fdiv>\n          <div style=\"display: inline-flex; gap: 5px; flex-wrap: wrap; justify-content: center; margin-top: 6px;\">\n            <span style=\"font-size: 11.5px; background: #F4F4F2; border-radius: 100px; padding: 3px 9px; color: #85857F;\">background<\u002Fspan>\n            <span style=\"font-size: 11.5px; background: #F4F4F2; border-radius: 100px; padding: 3px 9px; color: #85857F;\">shadows<\u002Fspan>\n            <span style=\"font-size: 11.5px; background: #F4F4F2; border-radius: 100px; padding: 3px 9px; color: #85857F;\">fill<\u002Fspan>\n            <span style=\"font-size: 11.5px; background: #F4F4F2; border-radius: 100px; padding: 3px 9px; color: #85857F;\">sharpness<\u002Fspan>\n            <span style=\"font-size: 11.5px; background: #F4F4F2; border-radius: 100px; padding: 3px 9px; color: #85857F;\">defects<\u002Fspan>\n            <span style=\"font-size: 11.5px; background: #F4F4F2; border-radius: 100px; padding: 3px 9px; color: #85857F;\">AI artifacts<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ submitRun }}\" style=\"width: 100%; margin-top: 12px; background: {{ submitBg }}; color: #FFFFFF; border: none; border-radius: 100px; padding: 13px 16px; font-family: 'DM Sans', sans-serif; font-size: 14.5px; font-weight: 650; cursor: {{ submitCursor }}; letter-spacing: 0.01em;\" style-hover=\"filter: brightness(1.15);\">Analyze image<\u002Fbutton>\n        <sc-if value=\"{{ pendingName }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top: 10px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #146C43;\">✓ {{ pendingName }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ auditNote }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top: 10px; background: #FBF0DA; border: 1px solid #EAD9AE; border-radius: 10px; padding: 9px 12px; font-size: 12.5px; color: #8A5A00;\"><span style=\"font-weight: 700;\">{{ dataStateLabel }}<\u002Fspan> — {{ auditNote }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ error }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top: 14px; background: #FBE7E5; color: #B3261E; border-radius: 10px; padding: 10px 14px; font-size: 14px;\">{{ error }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"margin-top: 18px; font-size: 13px; color: #8A8F95; text-align: center; line-height: 1.6;\">Every verdict is backed by a measured value from the actual pixels — no guessed warnings. Semantic checks (props, text, defects) run through an AI visual inspection pass.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showDetails }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex: 1; display: flex; justify-content: center; padding: 32px 24px;\">\n      <div style=\"max-width: 960px; width: 100%;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px;\">\n          <div>\n            <div style=\"font-size: 19px; font-weight: 650; letter-spacing: -0.01em;\">Listing details per image<\u002Fdiv>\n            <div style=\"font-size: 13px; color: #9A9A94; margin-top: 2px;\">Optional — fill only what you know (seller-entered). Each image's checks use its own details.<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ backToHome }}\" style=\"background: #FFFFFF; color: #17191C; border: 1px solid #E0E0DC; border-radius: 100px; padding: 8px 16px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;\" style-hover=\"background: #F4F4F2;\">← Back<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <sc-for list=\"{{ detailImages }}\" as=\"di\" hint-placeholder-count=\"2\">\n            <div style=\"background: #FFFFFF; border: 1px solid #EEEEEB; border-radius: 18px; padding: 16px; display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: start; box-shadow: 0 1px 2px rgba(20,20,15,0.03);\">\n              <div>\n                <div ref=\"{{ di.thumbRef }}\" style=\"width: 120px; height: 120px; background: #FAFAF9; border-radius: 12px; background-size: contain; background-repeat: no-repeat; background-position: center;\"><\u002Fdiv>\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #55595E; margin-top: 6px; word-break: break-all;\">{{ di.name }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px;\">\n                <sc-for list=\"{{ di.fields }}\" as=\"fld\" hint-placeholder-count=\"6\">\n                  <div><label style=\"font-size: 11.5px; color: #85857F;\">{{ fld.label }}<\u002Flabel><input value=\"{{ fld.value }}\" sc-camel-on-change=\"{{ fld.set }}\" style=\"width: 100%; box-sizing: border-box; border: 1px solid #E0E0DC; border-radius: 10px; padding: 7px 10px; font-size: 13px; margin-top: 3px;\"><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 10px; margin-top: 16px;\">\n          <button sc-camel-on-click=\"{{ runWithDetails }}\" style=\"flex: 2; background: #17191C; color: #FFFFFF; border: none; border-radius: 100px; padding: 13px 16px; font-family: 'DM Sans', sans-serif; font-size: 14.5px; font-weight: 650; cursor: pointer;\" style-hover=\"filter: brightness(1.15);\">Save details &amp; run checker<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ runSkip }}\" style=\"flex: 1; background: #FFFFFF; color: #17191C; border: 1px solid #E0E0DC; border-radius: 100px; padding: 13px 16px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 550; cursor: pointer;\" style-hover=\"background: #F4F4F2;\">Skip — analyze images only<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ analyzing }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px;\">\n      <div style=\"background: #FFFFFF; border: 1px solid #E3E4E0; border-radius: 10px; padding: 36px 44px; display: flex; align-items: center; gap: 18px; box-shadow: 0 1px 3px rgba(23,25,28,0.06);\">\n        <div style=\"width: 26px; height: 26px; border: 3px solid #E3E4E0; border-top-color: #E8890C; border-radius: 50%; animation: spin 0.8s linear infinite;\"><\u002Fdiv>\n        <div>\n          <div style=\"font-weight: 600; font-size: 16px;\">Analyzing image<\u002Fdiv>\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #6B7076; margin-top: 3px;\">{{ batchNote }} {{ progress }}…<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hasReport }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding: 16px 32px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;\">\n      <button sc-camel-on-click=\"{{ goHome }}\" style=\"background: #FFFFFF; color: #17191C; border: 1px solid #E0E0DC; border-radius: 100px; padding: 8px 16px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;\" style-hover=\"background: #F4F4F2;\">← Home / new image<\u002Fbutton>\n      <sc-if value=\"{{ showTabs }}\" hint-placeholder-val=\"{{ false }}\">\n        <sc-for list=\"{{ reportTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n          <button sc-camel-on-click=\"{{ t.select }}\" style=\"background: {{ t.tabBg }}; color: {{ t.tabColor }}; border: 1px solid {{ t.tabBorder }}; border-radius: 100px; padding: 8px 14px; font-family: 'DM Sans', sans-serif; font-size: 12.5px; font-weight: 550; cursor: pointer; display: flex; align-items: center; gap: 7px;\">\n            <span style=\"width: 8px; height: 8px; border-radius: 100px; background: {{ t.dotColor }};\"><\u002Fspan>{{ t.name }}\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"flex: 1; display: grid; grid-template-columns: minmax(340px, 480px) minmax(420px, 1fr); gap: 24px; padding: 16px 32px 24px; align-items: start;\">\n      <div style=\"position: sticky; top: 24px; display: flex; flex-direction: column; gap: 14px;\">\n        <div style=\"background: #FFFFFF; border: 1px solid #EEEEEB; border-radius: 18px; overflow: hidden; box-shadow: 0 1px 2px rgba(20,20,15,0.03);\">\n          <div style=\"position: relative; background: repeating-conic-gradient(#F7F7F5 0% 25%, #EDEEEA 0% 50%) 0 0 / 20px 20px;\" sc-camel-on-click=\"{{ clearSelection }}\">\n            <sc-if value=\"{{ imgUrl }}\" hint-placeholder-val=\"{{ false }}\">\n              <img ref=\"{{ imgRef }}\" sc-camel-on-load=\"{{ redraw }}\" style=\"display: block; width: 100%; height: auto;\" alt=\"Uploaded product image\">\n              <canvas ref=\"{{ canvasRef }}\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;\"><\u002Fcanvas>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"padding: 12px 16px; border-top: 1px solid #EDEEEA; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center;\">\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: #55595E;\">{{ metaLine }}<\u002Fdiv>\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: #8A8F95;\">{{ overlayHint }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ productType }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background: #FFFFFF; border: 1px solid #E3E4E0; border-radius: 12px; padding: 10px 16px; font-size: 14px; color: #55595E;\"><span style=\"font-weight: 600; color: #17191C;\">Identified:<\u002Fspan> {{ productType }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display: flex; gap: 10px;\">\n          <button sc-camel-on-click=\"{{ goHome }}\" style=\"flex: 1; background: #17191C; color: #FFFFFF; border: none; border-radius: 10px; padding: 11px 16px; font-family: 'DM Sans', sans-serif; font-size: 14.5px; font-weight: 600; cursor: pointer;\" style-hover=\"background: #2A2D33;\">New image<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ toggleAll }}\" style=\"flex: 1; background: #FFFFFF; color: #17191C; border: 1px solid #D6D8D3; border-radius: 10px; padding: 11px 16px; font-family: 'DM Sans', sans-serif; font-size: 14.5px; font-weight: 500; cursor: pointer;\" style-hover=\"background: #F7F7F5;\">{{ toggleLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 16px; min-width: 0;\">\n        <div style=\"background: {{ verdictBg }}; border: 1px solid {{ verdictBorder }}; border-radius: 10px; padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;\">\n          <div>\n            <div style=\"font-size: 19px; font-weight: 700; color: {{ verdictColor }};\">{{ verdictTitle }}<\u002Fdiv>\n            <div style=\"font-size: 14px; color: #4A4E54; margin-top: 3px;\">{{ verdictSub }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px;\">\n            <div style=\"text-align: center; background: rgba(255,255,255,0.7); border-radius: 10px; padding: 8px 14px;\"><div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 600; color: #B3261E;\">{{ nFails }}<\u002Fdiv><div style=\"font-size: 11.5px; color: #6B7076; letter-spacing: 0.04em;\">FAILED<\u002Fdiv><\u002Fdiv>\n            <div style=\"text-align: center; background: rgba(255,255,255,0.7); border-radius: 10px; padding: 8px 14px;\"><div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 600; color: #8A5A00;\">{{ nWarns }}<\u002Fdiv><div style=\"font-size: 11.5px; color: #6B7076; letter-spacing: 0.04em;\">WARNINGS<\u002Fdiv><\u002Fdiv>\n            <div style=\"text-align: center; background: rgba(255,255,255,0.7); border-radius: 10px; padding: 8px 14px;\"><div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 600; color: #146C43;\">{{ nPasses }}<\u002Fdiv><div style=\"font-size: 11.5px; color: #6B7076; letter-spacing: 0.04em;\">PASSED<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ visionNote }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background: #FBF0DA; border: 1px solid #EAD9AE; border-radius: 12px; padding: 10px 16px; font-size: 13.5px; color: #8A5A00;\">{{ visionNote }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ readinessScore }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background: #FFFFFF; border: 1px solid #E3E4E0; border-radius: 10px; padding: 16px 20px; box-shadow: 0 1px 3px rgba(23,25,28,0.06);\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;\">\n              <div style=\"font-size: 15.5px; font-weight: 700;\">Visual Sales Readiness Score<\u002Fdiv>\n              <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; color: #17191C;\">{{ readinessScore }}<span style=\"font-size: 14px; color: #8A8F95;\">/100<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 18px; margin-top: 10px;\">\n              <sc-for list=\"{{ readinessComponents }}\" as=\"rc\" hint-placeholder-count=\"4\">\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #55595E; line-height: 1.6;\">{{ rc.line }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size: 12px; color: #8A8F95; margin-top: 10px; line-height: 1.5; text-wrap: pretty;\">{{ readinessDisclaimer }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <div style=\"background: #FFFFFF; border: 1px solid #EEEEEB; border-radius: 18px; overflow: hidden; box-shadow: 0 1px 2px rgba(20,20,15,0.03);\">\n            <div style=\"padding: 11px 18px; border-bottom: 1px solid #F2F2F0; display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n              <div style=\"font-size: 14px; font-weight: 650; letter-spacing: -0.01em;\">{{ g.name }}<\u002Fdiv>\n              <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9A9A94;\">{{ g.countLine }}<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ g.allClear }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding: 11px 18px; font-size: 13px; color: #146C43; display: flex; gap: 8px; align-items: center;\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; background: #E7F4EC; border-radius: 100px; padding: 3px 9px;\">PASSED<\u002Fspan>{{ g.allClear }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ g.checks }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ c.select }}\" style=\"padding: 11px 18px; border-bottom: 1px solid #F6F6F4; cursor: {{ c.cursor }}; background: {{ c.rowBg }}; box-shadow: {{ c.rowRing }};\">\n                <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;\">\n                  <div style=\"font-size: 14.5px; font-weight: 600; color: #17191C;\">{{ c.name }}<\u002Fdiv>\n                  <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; background: {{ c.chipBg }}; color: {{ c.chipColor }}; border-radius: 100px; padding: 3px 9px; letter-spacing: 0.03em; white-space: nowrap;\">{{ c.statusLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-if value=\"{{ c.confText }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9A9A94; margin-top: 3px; line-height: 1.5;\">{{ c.confText }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ c.why }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size: 13.5px; color: #4A4E54; margin-top: 5px; line-height: 1.5; max-width: 72ch; text-wrap: pretty;\">{{ c.why }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6B7076; margin-top: 5px; line-height: 1.55;\">▸ {{ c.evidence }}<\u002Fdiv>\n                <sc-if value=\"{{ c.regionNote }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size: 12px; color: {{ c.regionColor }}; margin-top: 4px; font-weight: 600;\">{{ c.regionNote }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ g.restNote }}\" hint-placeholder-val=\"{{ false }}\">\n              <div sc-camel-on-click=\"{{ g.toggle }}\" style=\"padding: 9px 18px; font-size: 12.5px; color: #6B7076; cursor: pointer; text-align: center;\" style-hover=\"background: #FAFAF9; color: #17191C;\">{{ g.restNote }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <div style=\"background: #FFFFFF; border: 1px solid #EEEEEB; border-radius: 18px; overflow: hidden; box-shadow: 0 1px 2px rgba(20,20,15,0.03); margin-bottom: 24px;\">\n          <div style=\"padding: 14px 20px; border-bottom: 1px solid #EDEEEA; font-size: 15.5px; font-weight: 700;\">Improvement Recommendations<\u002Fdiv>\n          <div style=\"background: #FFFFFF; border: 1px solid #EEEEEB; border-radius: 18px; overflow: hidden; box-shadow: 0 1px 2px rgba(20,20,15,0.03);\">\n          <div sc-camel-on-click=\"{{ toggleDiag }}\" style=\"padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;\" style-hover=\"background: #F7F7F5;\">\n            <div style=\"font-size: 15.5px; font-weight: 700;\">Catalog Match &amp; Suppression Diagnosis<\u002Fdiv>\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #1B4B91;\">{{ diagToggleLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showDiag }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border-top: 1px solid #EDEEEA; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px;\">\n              <div style=\"font-size: 12.5px; color: #8A8F95;\">Separate from image compliance — a compliant-looking image can still be suppressed by a catalog or identifier mismatch. Analyzed images available for cross-variant comparison: <span style=\"font-family: 'IBM Plex Mono', monospace;\">{{ analyzedNames }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;\">\n                <div><label style=\"font-size: 12.5px; color: #55595E;\">Suppressed ASIN<\u002Flabel><input value=\"{{ dAsin }}\" sc-camel-on-change=\"{{ setDAsin }}\" placeholder=\"B0DSF2B6ZW\" style=\"width: 100%; box-sizing: border-box; border: 1px solid #D6D8D3; border-radius: 10px; padding: 7px 9px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; margin-top: 3px;\"><\u002Fdiv>\n                <div><label style=\"font-size: 12.5px; color: #55595E;\">Variation theme<\u002Flabel><input value=\"{{ dTheme }}\" sc-camel-on-change=\"{{ setDTheme }}\" placeholder=\"Color\" style=\"width: 100%; box-sizing: border-box; border: 1px solid #D6D8D3; border-radius: 10px; padding: 7px 9px; font-size: 13px; margin-top: 3px;\"><\u002Fdiv>\n                <div><label style=\"font-size: 12.5px; color: #55595E;\">Suppressed image file name<\u002Flabel><input value=\"{{ dSupImage }}\" sc-camel-on-change=\"{{ setDSupImage }}\" placeholder=\"White.jpg\" style=\"width: 100%; box-sizing: border-box; border: 1px solid #D6D8D3; border-radius: 10px; padding: 7px 9px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; margin-top: 3px;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div><label style=\"font-size: 12.5px; color: #55595E;\">Amazon suppression message<\u002Flabel><textarea value=\"{{ dMsg }}\" sc-camel-on-change=\"{{ setDMsg }}\" placeholder=\"Paste the exact message…\" style=\"width: 100%; box-sizing: border-box; min-height: 48px; border: 1px solid #D6D8D3; border-radius: 10px; padding: 8px 10px; font-family: 'DM Sans', sans-serif; font-size: 13.5px; resize: vertical; margin-top: 3px;\"><\u002Ftextarea><\u002Fdiv>\n              <div><label style=\"font-size: 12.5px; color: #55595E;\">Suppressed child attributes (key: value; …)<\u002Flabel><textarea value=\"{{ dSupAttrs }}\" sc-camel-on-change=\"{{ setDSupAttrs }}\" placeholder=\"itemShape: Round; productType: Butter Dish; color: White; packageQuantity: 1; upc: 0123456789012\" style=\"width: 100%; box-sizing: border-box; min-height: 48px; border: 1px solid #D6D8D3; border-radius: 10px; padding: 8px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; resize: vertical; margin-top: 3px;\"><\u002Ftextarea><\u002Fdiv>\n              <div><label style=\"font-size: 12.5px; color: #55595E;\">Sibling variations — one per line: ASIN | status | image file | attributes<\u002Flabel><textarea value=\"{{ dSibs }}\" sc-camel-on-change=\"{{ setDSibs }}\" placeholder=\"B0EXAMPLE1 | approved | Green.jpg | itemShape: Crock; color: Verona\nB0EXAMPLE2 | approved | | itemShape: Crock; color: Oceanic\" style=\"width: 100%; box-sizing: border-box; min-height: 60px; border: 1px solid #D6D8D3; border-radius: 10px; padding: 8px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; resize: vertical; margin-top: 3px;\"><\u002Ftextarea><\u002Fdiv>\n              <button sc-camel-on-click=\"{{ runDiagnosis }}\" style=\"align-self: flex-start; background: #1B4B91; color: #FFFFFF; border: none; border-radius: 10px; padding: 10px 18px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer;\" style-hover=\"background: #143a72;\">Run diagnosis<\u002Fbutton>\n\n              <sc-if value=\"{{ diag }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border-top: 1px solid #EDEEEA; padding-top: 12px; display: flex; flex-direction: column; gap: 12px;\">\n                  <sc-for list=\"{{ diag.summaryRows }}\" as=\"sr\" hint-placeholder-count=\"5\">\n                    <div style=\"display: flex; gap: 12px; align-items: baseline;\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 600; color: #8A8F95; min-width: 210px;\">{{ sr.k }}<\u002Fspan><span style=\"font-size: 14px; font-weight: 600; color: {{ sr.badColor }};\">{{ sr.v }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"background: #F7F7F5; border-radius: 12px; padding: 12px 14px;\">\n                    <div style=\"font-size: 13.5px; font-weight: 700;\">Suppression message → {{ diag.msgType }}<\u002Fdiv>\n                    <sc-if value=\"{{ diag.msgNote }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size: 13px; color: #55595E; margin-top: 4px;\">{{ diag.msgNote }}<\u002Fdiv><\u002Fsc-if>\n                    <sc-if value=\"{{ diag.msgExcluded }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size: 12.5px; color: #8A8F95; margin-top: 4px;\">Not confirmed by the message: {{ diag.msgExcluded }}<\u002Fdiv><\u002Fsc-if>\n                    <div style=\"font-size: 12.5px; color: #1B4B91; margin-top: 4px;\">Investigate: {{ diag.msgInvestigate }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ diag.conflicts }}\" as=\"cf\" hint-placeholder-count=\"1\">\n                    <div style=\"background: #FBE7E5; border: 1px solid #F1C4C0; border-radius: 12px; padding: 12px 14px;\">\n                      <div style=\"font-size: 13.5px; font-weight: 700; color: #B3261E;\">{{ cf.line }}<\u002Fdiv>\n                      <div style=\"font-size: 13px; color: #4A4E54; margin-top: 4px; line-height: 1.5;\">{{ cf.reason }}<\u002Fdiv>\n                      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: #8A5A00; margin-top: 4px;\">{{ cf.evidence }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-for list=\"{{ diag.catRows }}\" as=\"cr\" hint-placeholder-count=\"2\">\n                    <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #55595E; line-height: 1.5;\">▸ {{ cr.line }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"font-size: 12px; color: #8A8F95;\">{{ diag.exactCount }} attribute comparison(s) matched exactly.<\u002Fdiv>\n                  <sc-for list=\"{{ diag.imgCompare }}\" as=\"ic\" hint-placeholder-count=\"2\">\n                    <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #17191C;\">{{ ic.line }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-for list=\"{{ diag.shared }}\" as=\"sh\" hint-placeholder-count=\"2\">\n                    <div style=\"font-size: 13px; color: #4A4E54; line-height: 1.5;\"><span style=\"font-weight: 600;\">{{ sh.line }}<\u002Fspan> — {{ sh.reason }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-if value=\"{{ diag.wow }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"background: #FBF0DA; border-radius: 12px; padding: 10px 14px; font-size: 13px; color: #8A5A00; line-height: 1.5;\">{{ diag.wow.text }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"font-size: 14px; font-weight: 700; margin-top: 2px;\">Ranked likely selective causes<\u002Fdiv>\n                  <sc-for list=\"{{ diag.ranking }}\" as=\"rk\" hint-placeholder-count=\"3\">\n                    <div style=\"border-left: 3px solid {{ rk.color }}; padding-left: 10px;\">\n                      <div style=\"font-size: 13.5px; font-weight: 600; color: {{ rk.color }};\">{{ rk.line }} <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8A8F95;\">({{ rk.evidence }})<\u002Fspan><\u002Fdiv>\n                      <div style=\"font-size: 13px; color: #4A4E54; line-height: 1.5;\">{{ rk.reason }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"font-size: 14px; font-weight: 700; margin-top: 2px;\">Recommended order of actions<\u002Fdiv>\n                  <sc-for list=\"{{ diag.recs }}\" as=\"dr\" hint-placeholder-count=\"4\">\n                    <div style=\"display: flex; gap: 8px; font-size: 13.5px; color: #33363C; line-height: 1.5;\"><span style=\"color: #1B4B91; font-weight: 700;\">{{ dr.n }}<\u002Fspan><span>{{ dr.t }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasRecs }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding: 4px 20px 16px;\">\n              <sc-for list=\"{{ recs }}\" as=\"r\" hint-placeholder-count=\"2\">\n                <div style=\"padding: 13px 0; border-bottom: 1px solid #F2F2EF;\">\n                  <div style=\"display: flex; gap: 10px; align-items: baseline;\">\n                    <span style=\"color: #E8890C; font-weight: 700; font-size: 14px;\">{{ r.n }}<\u002Fspan>\n                    <span style=\"font-size: 14.5px; font-weight: 600;\">{{ r.issue }}<\u002Fspan>\n                    <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 600; background: {{ r.chipBg }}; color: {{ r.chipColor }}; border-radius: 4px; padding: 2px 7px;\">{{ r.statusLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"margin-left: 22px; margin-top: 5px; display: flex; flex-direction: column; gap: 4px;\">\n                    <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6B7076; line-height: 1.55;\">▸ {{ r.evidence }}<\u002Fdiv>\n                    <div style=\"font-size: 13.5px; color: #4A4E54; line-height: 1.5; max-width: 72ch; text-wrap: pretty;\"><span style=\"font-weight: 600; color: #17191C;\">Why it matters:<\u002Fspan> {{ r.why }}<\u002Fdiv>\n                    <div style=\"font-size: 13.5px; color: #4A4E54; line-height: 1.5; max-width: 72ch; text-wrap: pretty;\"><span style=\"font-weight: 600; color: #0F5A52;\">Fix:<\u002Fspan> {{ r.action }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noRecs }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding: 16px 20px; display: flex; align-items: center; gap: 10px;\">\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 600; background: #E7F4EC; color: #146C43; border-radius: 4px; padding: 3px 8px;\">PASSED<\u002Fspan>\n              <span style=\"font-size: 14px; color: #4A4E54;\">No improvement needed — no detected issue requires corrective action.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <input ref=\"{{ fileRef }}\" type=\"file\" accept=\"image/*\" multiple=\"{{ true }}\" sc-camel-on-change=\"{{ fileChanged }}\" style=\"display: none;\">\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;aiVision&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Analysis&quot;}, &quot;fillTarget&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 85, &quot;min&quot;: 60, &quot;max&quot;: 95, &quot;step&quot;: 1, &quot;unit&quot;: &quot;%&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Analysis&quot;}}\">\nclass Component extends DCLogic {\n  state = { phase: 'empty', progress: '', report: null, selectedId: null, showAll: true, error: null, drag: false, listingText: '', packageQty: '', history: {}, diag: null, dSupAttrs: '', dSupImage: '', dSibs: '', dMsg: '', dTheme: 'Color', dAsin: '', showDiag: false, hAsin: '', hMkt: 'ATVPDKIKX0DER', imgSrc: 'upload', connNote: null, connState: 'unavailable', auditNote: null, dataState: null, showManual: false };\n\n  componentDidMount() {\n    this.enginePromise = import(window.__resources.engineJs);\n    this.spPromise = import(window.__resources.spJs);\n    this.imgRef = React.createRef();\n    this.canvasRef = React.createRef();\n    this.fileRef = React.createRef();\n    this._onResize = () => this.redraw();\n    window.addEventListener('resize', this._onResize);\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }\n  componentDidUpdate() { this.redraw(); }\n\n  redraw = () => {\n    const img = this.imgRef && this.imgRef.current, cv = this.canvasRef && this.canvasRef.current;\n    const rep = this.state.report;\n    if (img && rep && img.getAttribute('src') !== rep.url) img.src = rep.url;\n    if (!img || !cv || !rep || !img.clientWidth) return;\n    const dpr = window.devicePixelRatio || 1;\n    cv.width = img.clientWidth * dpr; cv.height = img.clientHeight * dpr;\n    const ctx = cv.getContext('2d');\n    ctx.scale(dpr, dpr);\n    ctx.clearRect(0, 0, img.clientWidth, img.clientHeight);\n    const sx = img.clientWidth / rep.meta.analysisW, sy = img.clientHeight / rep.meta.analysisH;\n    const draw = (check, strong) => {\n      const col = check.status === 'fail' ? '#D93025' : check.status === 'warn' ? '#B7791F' : '#146C43';\n      ctx.lineWidth = strong ? 2.5 : 1.5;\n      ctx.setLineDash(strong ? [] : [5, 4]);\n      check.regions.forEach(r => {\n        const x = r.x * sx, y = r.y * sy, rw = Math.max(6, r.w * sx), rh = Math.max(6, r.h * sy);\n        ctx.strokeStyle = col;\n        ctx.fillStyle = col + (strong ? '2E' : '14');\n        ctx.fillRect(x, y, rw, rh);\n        ctx.strokeRect(x, y, rw, rh);\n        if (strong) {\n          ctx.setLineDash([]);\n          ctx.font = '600 10px IBM Plex Mono, monospace';\n          const label = check.statusLabel || check.status.toUpperCase();\n          ctx.fillStyle = col;\n          const ty = y > 16 ? y - 4 : y + rh + 12;\n          ctx.fillText(check.name, Math.max(2, x), ty);\n        }\n      });\n    };\n    const all = [];\n    rep.groups.forEach(g => g.checks.forEach(c => all.push(c)));\n    const selected = all.find(c => this.selKey(c) === this.state.selectedId);\n    if (selected) draw(selected, true);\n    else if (this.state.showAll) all.filter(c => (c.status === 'fail' || c.status === 'warn') && c.regions.length && !c.id.startsWith('risk-')).forEach(c => draw(c, false));\n  };\n\n  selKey(c) { return c.group + '::' + c.id; }\n\n  pickFile = () => { if (this.fileRef && this.fileRef.current) this.fileRef.current.click(); };\n  fileChanged = (e) => { const fs = Array.from(e.target.files || []).filter(f => f.type.startsWith('image/')); if (fs.length) this.setState({ pendingFiles: (this.state.pendingFiles || []).concat(fs), error: null }); e.target.value = ''; };\n  composeAttrs() {\n    const S = this.state, m = { title: S.pTitle, productType: S.pType, itemShape: S.pShape, color: S.pColor, size: S.pSize, material: S.pMaterial, packageQuantity: S.pQty, numberOfItems: S.pNum, includedComponents: S.pComp, upc: S.pUpc };\n    return Object.entries(m).filter(([k, v]) => (v || '').trim()).map(([k, v]) => k + ': ' + v.trim()).join('; ');\n  }\n  hasListingDetails() { return !!(this.composeAttrs() || this.state.dSibs.trim()); }\n  submitRun = () => {\n    const files = this.state.pendingFiles || [];\n    if (!files.length) { this.setState({ error: 'Upload at least one candidate MAIN image first.' }); return; }\n    const perImage = Object.assign({}, this.state.perImage);\n    files.forEach(f => { if (!perImage[f.name]) perImage[f.name] = { url: URL.createObjectURL(f) }; });\n    this.setState({ phase: 'details', perImage, error: null });\n  };\n  composeImageAttrs(name) {\n    const d = (this.state.perImage || {})[name] || {};\n    const keys = ['title', 'productType', 'itemShape', 'color', 'size', 'material', 'packageQuantity', 'includedComponents', 'variationTheme', 'asin', 'parentAsin'];\n    return keys.filter(k
